# ./voxer.sh start — asks for Twitch credentials in your host browser once.
# Default is a local image built on first use. Choose VOXER_IMAGE explicitly
# for a registry image; cached starts neither build nor pull.
services:
  voxer:
    image: ${VOXER_IMAGE:-twitch-voxer:local}
    build:
      context: .
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:4343:4343"
    # Existing .env installs remain supported; no .env is required for setup.
    env_file:
      - path: .env
        required: false
    environment:
      VOXER_SETTINGS_FILE: /data/settings.json
      VOXER_TOKEN_FILE: /data/tokens.json
      VOXER_DB_PATH: /data/voices.json
      VOXER_TIMESTAMPS_DB_PATH: /data/timestamps.json
      VOXER_MESSAGES_PATH: /data/messages.json
      VOXER_EMOTES_DB_PATH: /data/emotes.json
      VOXER_AUDIO_DIR: /tmp/audio
      VOXER_SERVER_HOST: "0.0.0.0"
      VOXER_SERVER_PORT: "8080"
      VOXER_OAUTH_HOST: "0.0.0.0"
      VOXER_OAUTH_PORT: "4343"
    volumes:
      - voxer-state:/data
      - tts-cache:/home/voxer/.cache
      # Advanced local-only customization (ensure you have asset rights):
      # - ./voices:/app/voices:ro
      # - ./voxer/sounds:/app/voxer/sounds:ro
    restart: unless-stopped

volumes:
  voxer-state:
  tts-cache:
